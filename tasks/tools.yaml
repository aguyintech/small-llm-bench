          '
    expected:
      optimal_turns: 4
      file_checks:
        people/dana.md:
        # No `frontmatter` check here, deliberately — see the note above the task.
        - type: table_wellformed
          section: '## Meetings'
        - type: table_rows_preserved
          section: '## Meetings'
          key_column: 0
        - type: table_row_position
          section: '## Meetings'
          contains: Payments review
          index: 0
        - type: section_contains
          section: '## Meetings'
          value: '[[2026-08-21]]'
        - type: bullets_wellformed
          section: '## Threads'
        - type: bullets_wellformed
          section: '## Commitments'
        - type: lines_preserved
          section: '## Open questions'
      # Told to the JUDGE, not just to the reader. The frontmatter check was
      # removed from this task after the ten-model panel showed it measured a
      # per-model habit rather than capability and inverted the ranking. The
      # first judged run then demoted a qwen3.6-27b trial for exactly that
      # date, re-deriving the requirement from the prompt. A rubric this bank
      # narrowed on purpose has to be visible to the judge, or it is not
      # actually narrowed.
      not_graded:
      - The `updated:` date in the YAML frontmatter. Any value is acceptable,
        including a stale one; do not lower the score for it.
      unchanged_paths:
        files:
        - people/marco.md
        - people/priya.md
    band: hard
